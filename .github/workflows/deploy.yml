name: deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: deploy en production
    runs-on: ubuntu-latest
    steps:
      - name: deploycommands
        uses: appleboy/ssh-action@master
        with:
          host: ${{secrets.HOST}}
          username: ${{secrets.USERNAME}}
          key: ${{secrets.KEY}}
          port: ${{secrets.PORT}}
          script:
            ./ejecutable.sh
